		<h1>Picto</h1>
		<p class="caption">Pictoは、写真を整理するためのデスクトップアプリです。</p>
		<div class="download">
			<span class="download-label">ダウンロード Picto <span id="version"></span></span>

	<div class="part part1">

		<div class="desc">
			<section>
				<h3>- 写真のコピー・移動</h3>
				<p>写真の撮影日などを利用した自由なファイル名やフォルダ名で、写真をコピー・移動できます。</p>
			</section>
			
			<section>
				<h3>- 写真ファイルの日付の変更</h3>
				<p>写真ファイルの作成日、更新日、アクセス日、Exif撮影日を変更できます。</p>
				<p>海外旅行などでカメラのタイムゾーンを変更し忘れた際に有効です。</p>
			</section>
			
			<section>
				<h3>- Exif情報の削除</h3>
				<p>GPS情報の削除や、Exif情報の全削除ができます。</p>
			</section>
