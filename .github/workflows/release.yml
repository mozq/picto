name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Windows app image ZIP
        run: ./gradlew.bat clean bundleWindowsApp

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: picto-windows
          path: build/distributions/*-windows-x64.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build unsigned macOS DMG
        run: ./gradlew clean bundleMacosApp

      # Future signing/notarization placeholders:
      # - Import a Developer ID Application certificate from GitHub Actions secrets.
      # - Sign Picto.app with codesign before creating the DMG, or sign the generated
      #   app image and then package it with jpackage.
      # - Store App Store Connect API credentials in secrets such as
      #   APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, and APPLE_API_PRIVATE_KEY.
      # - Submit with xcrun notarytool and staple the accepted ticket with xcrun stapler.
      # This workflow intentionally produces an unsigned DMG for now.

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: picto-macos-arm64
          path: build/distributions/*-macos-arm64.dmg
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Linux app image tar.gz
        run: ./gradlew clean bundleLinuxApp

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: picto-linux-x64
          path: build/distributions/*-linux-x64.tar.gz
          if-no-files-found: error

  build-generic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build generic Java ZIP
        run: ./gradlew clean distZip

      - name: Upload generic artifact
        uses: actions/upload-artifact@v7
        with:
          name: picto-generic
          path: build/distributions/picto-*.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
      - build-linux
      - build-generic
    permissions:
      contents: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          files: artifacts/*
